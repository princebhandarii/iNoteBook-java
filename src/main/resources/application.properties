spring.application.name=iNotebook
server.port=${PORT:8080}

# --- MySQL (override with environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inotebook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Session cookie hardening ---
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when served over HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=non_null
